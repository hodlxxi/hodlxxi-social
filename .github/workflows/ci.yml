name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install locked dependencies
        run: npm ci

      - name: Audit locked dependencies
        run: npm audit

      - name: Verify V1.28E browser crypto artifact
        run: |
          npm run build:v128e-crypto
          git diff --exit-code -- package.json package-lock.json web/vendor/hpke-core-v1.9.0.mjs
          echo "9f5eb8be623357983b9862b7e2513fad98d4afdc3ccac869bec315eaf40f43dc  web/vendor/hpke-core-v1.9.0.mjs" | sha256sum --check --strict

      - name: Run test suite
        run: node --test

      - name: Check domain module
        run: node --check src/domain.mjs

      - name: Check Nostr module
        run: node --check src/nostr.mjs

      - name: Check visibility module
        run: node --check src/visibility.mjs

      - name: Check frontend module
        run: node --check web/app.mjs

      - name: Check authenticated product modules
        run: |
          node --check web/auth-entry.mjs
          node --check web/auth-product.mjs
          node --check web/authenticated-public-read.mjs
          node --check web/authenticated-public-write.mjs
          node --check web/nostr-event-verifier.mjs
          node --check web/private-label-store.mjs
          node --check web/secure-messaging-v128.mjs
          node --check web/messaging-device-v128c1.mjs
          node --check web/message-encryption-v128e.mjs
          node --check web/vendor/hpke-core-v1.9.0.mjs

      - name: Check Social OAuth server modules
        run: |
          node --check src/server/social-oauth-config.mjs
          node --check src/server/social-oauth-cookie.mjs
          node --check src/server/social-oauth-memory.mjs
          node --check src/server/hodlxxi-oauth-client.mjs
          node --check src/server/social-oauth-bff.mjs
          node --check src/server/message-envelope-v128f1.mjs
          node --check scripts/hodlxxi-social-server.mjs
          node --check scripts/build-v128e-hpke-browser.mjs

      - name: Check private Full Directory and recipient capability modules
        run: |
          node --check src/server/ubid-full-directory-client.mjs
          node --check src/server/ubid-unix-socket-transport.mjs
          node --check src/server/opaque-recipient-capability.mjs
          node --check src/server/opaque-recipient-capability-issuer.mjs

      - name: Check production readiness modules
        run: |
          node --check src/server/social-production-readiness.mjs
          node --check scripts/hodlxxi-social-production-readiness.mjs

      - name: Check whitespace integrity
        run: git diff --check

  node18-v128e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild and verify V1.28E browser crypto artifact
        run: |
          npm run build:v128e-crypto
          git diff --exit-code -- package.json package-lock.json web/vendor/hpke-core-v1.9.0.mjs
          echo "9f5eb8be623357983b9862b7e2513fad98d4afdc3ccac869bec315eaf40f43dc  web/vendor/hpke-core-v1.9.0.mjs" | sha256sum --check --strict

      - name: Run focused V1.28E compatibility tests
        run: node tests/v128e-browser-message-encryption.test.mjs

      - name: Run focused V1.28F.1 compatibility tests
        run: node tests/v128f1-message-envelope-boundary.test.mjs

      - name: Run native V1.28C.1 X25519 CryptoKey compatibility test
        run: node --test-name-pattern="native WebCrypto safely exports only the public X25519 key and structured-clones the non-extractable private key" tests/v128c1-browser-device-setup.test.mjs
